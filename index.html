<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tints iOS Safari's toolbars and Android Chrome's status bar to the app's
         navy, instead of Safari sampling the page and landing on something
         lighter. This alone is what fixes the white frame (2026-09-11).

         ⛔ DO NOT ADD `viewport-fit=cover` TO THE VIEWPORT TAG ABOVE. It was
         added here on 2026-09-11 and removed on 2026-09-12 because it broke
         every screen on David's iPhone: it extends the page UNDER the status
         bar and the home indicator, and NOTHING in this app uses
         env(safe-area-inset-*) to compensate. So the status bar ate the top
         padding (the welcome and landing logos sat on the very top edge, and
         the dashboard's Sign Out could not be tapped at all) and the home
         indicator ate the bottom. It buys only navy behind the notch, which
         theme-color already handles. If it is ever wanted again, every
         top-level screen container needs safe-area padding FIRST. -->
    <meta name="theme-color" content="#0d1825" />
    <!-- THE app's fonts, in ONE place (2026-09-11). Five screens each carried
         their own @import inside a React-injected <style>, and they had drifted
         into three DIFFERENT requests: Landing, Admin and Dashboard loaded only
         two Fraunces instances (upright-300, italic-400) while asking for
         upright-400 on screen, and PatientApp downloaded the whole Cormorant
         Garamond family, which nothing has ever used.
         A <link> in <head> also starts the download immediately, where an
         @import inside injected CSS could not begin until React had mounted. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,300;9..144,0,400;9..144,1,300;9..144,1,400&family=DM+Sans:wght@400;500;600&display=swap" />
    <title>GlowPT</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="GlowPT">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
